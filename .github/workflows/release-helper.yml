name: Build native helper releases

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13
            asset: rwthonline_native_host_macos
          - runner: windows-latest
            asset: rwthonline_native_host_windows.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pyinstaller
      - run: pyinstaller --onefile --name rwthonline_native_host native_host/rwthonline_native_host.py
      - run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/rwthonline_native_host.exe dist/${{ matrix.asset }}
          else
            mv dist/rwthonline_native_host dist/${{ matrix.asset }}
          fi
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
