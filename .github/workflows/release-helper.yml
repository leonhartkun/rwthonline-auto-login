name: Build native helper releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the helper files
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13
            asset: rwthonline_native_host_macos_x86_64.zip
            expected_arch: x86_64
            upload_installers: true
          - runner: macos-14
            asset: rwthonline_native_host_macos_arm64.zip
            expected_arch: arm64
            upload_installers: false
          - runner: windows-latest
            asset: rwthonline_native_host_windows.exe
            expected_arch: windows
            upload_installers: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pyinstaller
      - run: python -m unittest native_host/tests/test_session_cache.py
      - run: test "$(uname -m)" = "${{ matrix.expected_arch }}"
        if: runner.os == 'macOS'
      # Windows releases contain one executable. Build it as a onefile binary so it
      # does not depend on the _internal folder created by PyInstaller's onedir mode.
      - run: pyinstaller --onefile --name rwthonline_native_host native_host/rwthonline_native_host.py
        if: runner.os == 'Windows'
      - run: pyinstaller --onedir --name rwthonline_native_host native_host/rwthonline_native_host.py
        if: runner.os == 'macOS'
      - run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/rwthonline_native_host.exe dist/${{ matrix.asset }}
          else
            # The PyInstaller onedir folder is not an application bundle. Signing the
            # folder itself creates a resource seal that becomes invalid after unzip.
            # Sign the executable Chrome launches, then archive the directory intact.
            codesign --force --sign - dist/rwthonline_native_host/rwthonline_native_host
            ditto -c -k --sequesterRsrc --keepParent dist/rwthonline_native_host dist/${{ matrix.asset }}
          fi
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: dist/${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        if: matrix.upload_installers
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: |
            installers/install_macos.sh
            installers/install_windows.ps1
