<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 RWTHonline Auto Login</title>
  <style>
    :root { color: #17212b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f9fb; }
    main { max-width: 560px; margin: 40px auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 6px 24px #17212b1c; }
    h1 { margin-top: 0; font-size: 24px; }
    p, label { line-height: 1.5; }
    label { display: block; margin-top: 18px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #aeb8c2; border-radius: 6px; font: inherit; }
    .hint, #status { color: #52616f; font-size: 14px; }
    #status { min-height: 22px; margin-top: 16px; }
    .error { color: #b42318 !important; }
    .success { color: #087443 !important; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button { padding: 10px 14px; border: 0; border-radius: 6px; background: #00549f; color: white; font: inherit; cursor: pointer; }
    button.secondary { background: #647482; }
    #helper_setup { margin: 20px 0; padding: 16px; border: 1px solid #c9d7e6; border-radius: 8px; background: #f2f7fb; }
    code { display: block; overflow-wrap: anywhere; margin: 10px 0; padding: 10px; background: #17212b; color: #fff; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>初始化 RWTHonline Auto Login</h1>
    <p>扩展不会上传账号密码或 Token。为了让浏览器在不重复询问密码的情况下自动登录，它使用一个开源本机助手，把凭据保存到 macOS 钥匙串或 Windows 凭据管理器。</p>
    <section id="helper_setup">
      <strong>第一步：安装本机助手</strong>
      <p>助手只做三件事：保存你的凭据到系统保险库、生成当前 TOTP、把登录所需值返回给本扩展。它不会访问其他网站，也不会联网发送数据。你可以先在 GitHub 查看其完整源代码。</p>
      <code id="install_command"></code>
      <button id="copy_install_command" type="button">复制安装命令</button>
      <a id="source_link" target="_blank" rel="noreferrer">查看 GitHub 源代码与安装说明</a>
    </section>
    <form id="onboarding_form">
      <label for="username">RWTH 用户名</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="password">RWTH 密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <label for="token_qr">Token 二维码图片</label>
      <input id="token_qr" name="token_qr" type="file" accept="image/*" required>
      <p class="hint">从设备本地选择你的 Token 二维码截图。扩展只读取其中的 TOTP 配置，并通过助手写入系统保险库。</p>

      <div id="status" role="status" aria-live="polite"></div>
      <div class="actions">
        <button type="submit">保存并启用自动登录</button>
        <button id="clear" class="secondary" type="button">删除本地数据</button>
      </div>
    </form>
  </main>
  <script type="module" src="onboarding.js"></script>
</body>
</html>
